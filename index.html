<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6c5ce7"><title>کودک دانا</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#eef2ff,#fff7e6);color:#263238;min-height:100vh}header{background:linear-gradient(135deg,#6c5ce7,#00b894);color:#fff;padding:24px 16px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 5px 18px #0002}h1{margin:0;font-size:30px}header p{margin:8px 0}.score{display:inline-block;background:#ffffff33;padding:7px 14px;border-radius:20px}.main{padding:18px;max-width:700px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:0;border-radius:22px;padding:20px 10px;background:#fff;box-shadow:0 5px 16px #00000012;font-size:18px;font-weight:bold;min-height:125px}.icon{display:block;font-size:42px;margin-bottom:8px}.quiz{display:none;background:#fff;border-radius:24px;padding:20px;box-shadow:0 5px 18px #0002}.q{font-size:21px;font-weight:bold;line-height:1.8;margin-bottom:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #e8e8ef;background:#fafafa;border-radius:16px;padding:14px;font-size:18px}.back{margin-top:15px;border:0;background:#636e72;color:#fff;padding:12px 20px;border-radius:15px;font-size:16px}.result{text-align:center;font-weight:bold;margin-top:15px;min-height:28px}footer{text-align:center;color:#777;padding:20px;font-size:13px}</style></head><body><header><h1>🌟 کودک دانا</h1><p>یاد بگیر، بازی کن و ستاره جمع کن!</p><div class="score" id="score">⭐ امتیاز: 0</div></header><main class="main"><div id="home" class="grid"><button class="card" onclick="openQ('الفبا')"><span class="icon">🔤</span>الفبا</button><button class="card" onclick="openQ('اعداد')"><span class="icon">🔢</span>اعداد و شمارش</button><button class="card" onclick="openQ('رنگ‌ها')"><span class="icon">🎨</span>رنگ‌ها و شکل‌ها</button><button class="card" onclick="openQ('هوش')"><span class="icon">🧠</span>بازی هوش</button><button class="card" onclick="openQ('حیوانات')"><span class="icon">🐾</span>حیوانات</button><button class="card" onclick="openQ('دانستنی‌ها')"><span class="icon">🌍</span>دانستنی‌ها</button></div><section id="quiz" class="quiz"><div id="title"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="result" class="result"></div><button class="back" onclick="home()">↩ بازگشت</button></section></main><footer>کودک دانا — آموزش شیرین برای کودکان</footer><script>let score=0;const data={الفبا:{q:'کدام حرف «الف» است؟',a:['ا','ب','ت','ج'],c:0},اعداد:{q:'۲ + ۳ چند می‌شود؟',a:['۴','۵','۶','۷'],c:1},'رنگ‌ها':{q:'کدام گزینه رنگ قرمز است؟',a:['🔵','🟢','🔴','🟡'],c:2},هوش:{q:'کدام حیوان پرواز می‌کند؟',a:['🐟 ماهی','🐦 پرنده','🐄 گاو','🐘 فیل'],c:1},حیوانات:{q:'کدام حیوان شیر می‌دهد؟',a:['🐔 مرغ','🐟 ماهی','🐄 گاو','🦋 پروانه'],c:2},'دانستنی‌ها':{q:'خورشید از کدام سمت طلوع می‌کند؟',a:['شرق','غرب','شمال','جنوب'],c:0}};function openQ(k){home(false);document.getElementById('quiz').style.display='block';document.getElementById('title').textContent='📚 '+k;document.getElementById('question').textContent=data[k].q;document.getElementById('result').textContent='';let box=document.getElementById('answers');box.innerHTML='';data[k].a.forEach((x,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>check(i,data[k].c);box.appendChild(b)})}function check(i,c){let r=document.getElementById('result');if(i===c){score+=10;document.getElementById('score').textContent='⭐ امتیاز: '+score;r.textContent='🎉 آفرین! پاسخ درست است. +۱۰ ستاره';r.style.color='#00a884'}else{r.textContent='💡 دوباره تلاش کن!';r.style.color='#d63031'}}function home(show=true){document.getElementById('quiz').style.display='none';document.getElementById('home').style.display='grid'}</script></body></html>
